<!DOCTYPE html>
<html>
<head>
  <title>DOM in JavaScript</title>
  <style>
    #demo {
      color: blue;
      font-size: 20px;
    }
    .highlight {
      background-color: yellow;
    }
  </style>
</head>
<body>
  <h1>JavaScript DOM</h1>

  <p id="demo">This is original text.</p>
  <button onclick="changeText()">Change Text</button>
  <button onclick="changeStyle()">Change Style</button>
  <button onclick="addElement()">Add Element</button>
  <button onclick="removeElement()">Remove Element</button>
  <button onclick="toggleClass()">Toggle Highlight</button>

  <div id="container"></div>

  <script>
    function changeText() {
      document.getElementById("demo").innerHTML = "Text changed using DOM!";
    }

    function changeStyle() {
      document.getElementById("demo").style.color = "red";
      document.getElementById("demo").style.fontSize = "30px";
    }

    function addElement() {
      let newPara = document.createElement("p");
      newPara.innerHTML = "I am a new paragraph added dynamically.";
      document.getElementById("container").appendChild(newPara);
    }

    function removeElement() {
      let container = document.getElementById("container");
      if (container.lastChild) {
        container.removeChild(container.lastChild);
      }
    }

    function toggleClass() {
      document.getElementById("demo").classList.toggle("highlight");
    }
  </script>
</body>
</html>
